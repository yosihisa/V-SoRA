[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "v-sora"
version = "0.1.0"
description = "Radio interferometer simulation, correlation and imaging"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.15,<2", "astropy>=7,<8", "matplotlib>=3.10,<4", "baseband>=4.3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
vsora-simulate = "vsora_simulator.__main__:main"
vsora-image = "vsora_imaging.__main__:main"
vsora-closure = "vsora_imaging.closure:main"
vsora-rml = "vsora_imaging.rml:main"
vsora-rate = "vsora_correlator.rate:main"
vsora-closure-session = "vsora_correlator.closure_pipeline:main"
vsora-synthesis = "vsora_imaging.synthesis:main"
vsora-correlate = "vsora_correlator.__main__:main"
vsora-ui = "vsora_ui.__main__:main"

[tool.setuptools]
packages = ["vsora_observation", "vsora_formats", "vsora_simulator", "vsora_imaging", "vsora_correlator", "vsora_ui"]
package-dir = {vsora_observation = "packages/observation/src/vsora_observation", vsora_formats = "packages/formats/src/vsora_formats", vsora_simulator = "apps/simulator/src/vsora_simulator", vsora_imaging = "apps/imaging/src/vsora_imaging", vsora_correlator = "apps/correlator/src/vsora_correlator", vsora_ui = "apps/ui/src/vsora_ui"}

[tool.setuptools.package-data]
vsora_ui = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/fonts/*"]

[tool.setuptools.data-files]
"share/v-sora/reference" = ["data/reference/casa-template-jy-pixel.fits", "data/reference/casa-template-jy-pixel.json"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests/integration"]
addopts = "-ra"
